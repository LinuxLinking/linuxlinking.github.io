<!--meta
title: 钟闪闪 · 作品与文字
description: 写工具，也写字。七个项目，四篇文章。
bodyClass: desktop-page
css: base.css, map.css
-->

<!-- 桌面上的快捷方式：7 个项目、文字、4 篇文章、Soul for U、站点图纸。 -->
<div class="xp-icons" id="xpIcons">{{iconGrid}}</div>

<!-- 给读屏软件与搜索引擎看的完整清单：桌面上的图标只有名字，这里是全部内容。 -->
<section class="sr-only">{{srIndex}}</section>

<!--block overlay-->
<!-- 图纸视图：铺满桌面区的一张图纸。它是桌面之上的一层，不在桌面里面。 -->
<div id="map" class="map is-hidden" aria-hidden="true" aria-label="站点图纸" data-i18n-aria="a11y.nodes" inert>
  <div class="map-bar">
    <span class="map-bar-title">{{mapTitle}}</span>
    <span class="hint">{{mapHint}}</span>
    <button class="xp-tbtn is-close" type="button" data-map-exit title="关闭">✕</button>
  </div>
  <div class="stage" id="stage"></div>
  <button class="btn map-exit" type="button" data-map-exit>{{mapExit}}</button>
</div>

<!-- 图纸的数据没加载出来时的兜底提示。 -->
<div class="state-error" id="stateError" hidden>
  <p data-i18n="error.data">数据没能加载出来。</p>
  <small data-i18n="error.dataHint">刷新试试，或者直接去 GitHub。</small>
</div>
<!--endblock-->
