<main class="page-wrap blog-wrap">

    <p class="kicker" data-i18n="blog.kicker">文字</p>
    <h1 data-i18n="blog.title">写下的东西</h1>
  </header>
  <div class="posts" id="posts">
    <div class="blog-empty">
      <div class="blog-empty-glyph" aria-hidden="true">✦ ✦ ✦</div>
      <h2 data-i18n="blog.empty">还没有文章。</h2>
      <p data-i18n="blog.emptyHint">有些话还在路上。先去看看做过的项目吧。</p>
      <a class="btn" href="{{link}}" data-i18n="blog.back">回到首页</a>
    </div>
  </div>
</main>
