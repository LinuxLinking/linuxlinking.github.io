<!DOCTYPE html>
<!--
  博客文章模板。发布一篇新文章的步骤：
  1. 复制本文件为 blog/<slug>/index.html（slug 用英文短横线命名）
  2. 替换 <title>、POST_TITLE、POST_DATE、POST_LEDE
  3. 把正文写进 <article class="post-body"> 里（纯 HTML，无 Markdown）
  4. 在 data/posts.json 的 posts 数组里加一条记录（slug / date / title / summary / url）
  注意：资源路径按 ../ 前缀写（本文件位于 blog/ 层级）；
        如果文章放在 blog/<slug>/ 子目录，全部资源路径要改成 ../../
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="description" content="POST_LEDE">
<title>POST_TITLE · 钟闪闪</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/post.css">
</head>
<body class="page-post">

<canvas id="stars" class="stars" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="../" aria-label="Home">
    <span class="brand-mark" aria-hidden="true">Z</span>
    <span class="brand-name" data-i18n="brand">钟闪闪</span>
  </a>
  <div class="topbar-actions">
    <div class="segmented" role="group" data-i18n-aria="a11y.lang">
      <button class="seg" type="button" data-lang-btn="zh" lang="zh">中</button>
      <button class="seg" type="button" data-lang-btn="en" lang="en">EN</button>
    </div>
    <a class="chip" href="../blog/" data-i18n="blog.back">返回蜂窝</a>
  </div>
</header>

<main class="post-wrap">
  <p class="post-kicker">POST_DATE</p>
  <h1>POST_TITLE</h1>
  <p class="post-lede">POST_LEDE</p>

  <article class="post-body">
    <!-- 正文从这里开始 -->
    <p>……</p>
    <!-- 正文到这里结束 -->
  </article>

  <div class="post-foot">
    <a class="btn" href="../blog/">← 更多文字</a>
    <a class="btn" href="../">返回蜂窝</a>
  </div>
</main>

<footer class="foot">
  <span>© 2026 <span data-i18n="brand">钟闪闪</span></span>
  <span class="sep">·</span>
  <a href="../soul-for-u/">Soul for U ↗</a>
  <span class="sep">·</span>
  <a href="https://github.com/LinuxLinking" target="_blank" rel="noopener">GitHub ↗</a>
</footer>

<script type="module" src="../js/post.js"></script>
</body>
</html>
