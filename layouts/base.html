<!DOCTYPE html>
<!--
  共享外壳：Windows XP 桌面 + 任务栏 + 开始菜单。

  首页就是桌面本身：图标是快捷方式，点开在 IE 窗口里显示。
  内容页由 tools/build.py 套进同一个 IE 窗口，也落在这张桌面上。
-->
<html lang="{{lang}}" data-root="{{link}}" data-title-zh="{{titleZh}}" data-title-en="{{titleEn}}" data-desc-zh="{{descZh}}" data-desc-en="{{descEn}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#245edb">
<meta name="description" content="{{description}}">
<title>{{title}}</title>
{{seoHead}}
<link rel="icon" href="{{asset}}assets/favicon.svg" type="image/svg+xml">
<!-- 装在别人的 IE 窗口里时（桌面上的图标打开的页面），只显示正文，不显示外壳。 -->
<script>if (window.self !== window.top) document.documentElement.classList.add("in-frame");</script>
{{styles}}
</head>
<body class="{{bodyClass}}">

<div class="xp-wallpaper" aria-hidden="true"></div>

<div class="xp-desktop" id="xpDesktop">
{{content}}
</div>

{{overlay}}

<div class="xp-taskbar">
  <button class="xp-start" id="xpStart" type="button" aria-expanded="false" aria-haspopup="true" aria-controls="xpStartMenu">
    <span class="xp-flag" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span>start</span>
  </button>
  <div class="xp-quick">
    <button type="button" data-quick="ie" data-i18n-title="quick.ie">{{ieIcon}}</button>
    <button type="button" data-quick="map" data-i18n-title="quick.map">{{mapIcon}}</button>
    <button type="button" data-quick="desktop" data-i18n-title="quick.desktop">{{desktopIcon}}</button>
  </div>
  <div class="xp-tasks" id="xpTasks"></div>
  <div class="xp-lang" role="group" aria-label="语言 / Language" data-i18n-aria="a11y.lang">
    <button type="button" data-lang-btn="zh" lang="zh">中</button>
    <button type="button" data-lang-btn="en" lang="en">EN</button>
  </div>
  <div class="xp-tray">
    <span class="xp-tray-icon" aria-hidden="true">{{speakerIcon}}</span>
    <span id="xpClock">--:--</span>
  </div>
</div>

<div class="xp-startmenu" id="xpStartMenu">
  <div class="xp-sm-head">
    <span class="xp-avatar" aria-hidden="true">Z</span>
    <div>
      <b>{{userName}}</b>
      <small>{{userRole}}</small>
    </div>
  </div>
  <div class="xp-sm-body">
    <div class="xp-sm-col">{{smLeft}}</div>
    <div class="xp-sm-col">{{smRight}}</div>
  </div>
  <div class="xp-sm-foot">
    <button type="button" data-close-sm data-sm="logoff">{{smLogout}}</button>
    <button type="button" data-close-sm data-sm="shutdown">{{smShutdown}}</button>
  </div>
</div>

<div class="xp-toast" id="xpToast" role="status" aria-live="polite"></div>

<!-- 对话框图标：构建期放在这儿，js 取来用，不必在 js 里再画一遍。 -->
<div id="xpIconStore" hidden aria-hidden="true">
  <span data-icon="info">{{iconInfo}}</span>
  <span data-icon="warn">{{iconWarn}}</span>
  <span data-icon="error">{{iconError}}</span>
</div>

<!-- 对话框：关于、页面属性、找不到页面、关机确认都走这一个壳。 -->
<div class="xp-modal" id="xpModal" hidden>
  <div class="xp-dialog" role="dialog" aria-modal="true" aria-labelledby="xpDlgTitle">
    <div class="xp-dlg-title">
      <span class="ic" id="xpDlgIcon" aria-hidden="true"></span>
      <span id="xpDlgTitle"></span>
      <button class="xp-tbtn is-close" type="button" data-dlg-close data-i18n-title="win.close">✕</button>
    </div>
    <div class="xp-dlg-body" id="xpDlgBody"></div>
    <div class="xp-dlg-foot" id="xpDlgFoot"></div>
  </div>
</div>

<!-- 关机、注销之后的两块整屏。 -->
<div class="xp-shutdown" id="xpShutdown" hidden>
  <p id="xpShutdownText"></p>
  <button class="btn" type="button" id="xpRestart"></button>
</div>
<div class="xp-logon" id="xpLogon" hidden>
  <div class="xp-logon-panel">
    <h2 id="xpLogonTitle"></h2>
    <p id="xpLogonHint"></p>
    <button class="xp-logon-user" type="button" id="xpLogonBack">
      <span class="xp-avatar" aria-hidden="true">Z</span>
      <span id="xpLogonName"></span>
    </button>
  </div>
</div>

{{windowTemplate}}
{{scripts}}
</body>
</html>
