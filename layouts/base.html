<!DOCTYPE html>
<!--
  共享外壳模板。改导航、页脚、meta 等只需动这一个文件，
  然后跑 `python tools/build.py` 重新生成所有页面。
-->
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14120f">
<meta name="description" content="{{description}}">
<title>{{title}}</title>
{{headExtra}}<link rel="icon" href="{{asset}}assets/favicon.svg" type="image/svg+xml">
{{styles}}
</head>
<body class="{{bodyClass}}">

{{pageDecor}}

<header class="topbar">
  <a class="brand" href="{{link}}" aria-label="Home">
    <span class="brand-mark" aria-hidden="true">Z</span>
    <span class="brand-name" data-i18n="brand">钟闪闪</span>
  </a>
  <div class="topbar-actions">
    <a class="nav-link" href="{{link}}blog/" data-i18n="nav.writing">文字</a>
    {{viewSwitcher}}
    <div class="segmented" role="group" data-i18n-aria="a11y.lang">
      <button class="seg" type="button" data-lang-btn="zh" lang="zh">中</button>
      <button class="seg" type="button" data-lang-btn="en" lang="en">EN</button>
    </div>
    {{topbarAction}}
  </div>
</header>

{{content}}

<footer class="foot">
  <span>© 2026 <span data-i18n="brand">钟闪闪</span></span>
  <span class="sep">·</span>
  <a href="{{link}}soul-for-u/">Soul for U ↗</a>
  <span class="sep">·</span>
  <a href="https://github.com/LinuxLinking" target="_blank" rel="noopener">GitHub ↗</a>
</footer>

{{scripts}}
</body>
</html>
