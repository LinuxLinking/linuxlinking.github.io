<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="robots" content="noindex">
<title>404 · 钟山杉</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/detail.css">
</head>
<body class="page-detail">

<canvas id="stars" class="stars" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="/" aria-label="Home">
    <span class="brand-mark" aria-hidden="true">Z</span>
    <span class="brand-name" data-i18n="brand">钟山杉</span>
  </a>
  <div class="topbar-actions">
    <div class="segmented" role="group" data-i18n-aria="a11y.lang">
      <button class="seg" type="button" data-lang-btn="zh" lang="zh">中</button>
      <button class="seg" type="button" data-lang-btn="en" lang="en">EN</button>
    </div>
    <a class="chip" href="/" data-i18n="nf.back">回到首页</a>
  </div>
</header>

<main class="detail-wrap">
  <div class="detail-card detail-notice">
    <p class="kicker">404</p>
    <h1 data-i18n="nf.title">这里只有星尘</h1>
    <p data-i18n="nf.body">这个地址不存在。回到蜂窝，那里有灯。</p>
    <a class="btn primary" href="/" data-i18n="nf.back">回到首页</a>
  </div>
</main>

<footer class="foot">
  <span>© 2026 <span data-i18n="brand">钟山杉</span></span>
  <span class="sep">·</span>
  <a href="/soul-for-u/">Soul for U ↗</a>
  <span class="sep">·</span>
  <a href="https://github.com/LinuxLinking" target="_blank" rel="noopener">GitHub ↗</a>
</footer>

<script type="module">
  import { startStarfield } from "/js/starfield.js";
  import { createI18n, loadStrings, resolveLang } from "/js/i18n.js";

  const i18n = createI18n({ strings: await loadStrings("/data/i18n.json"), lang: resolveLang() });
  startStarfield(document.getElementById("stars"));

  document.querySelectorAll("[data-lang-btn]").forEach((btn) => {
    btn.addEventListener("click", () => i18n.setLang(btn.dataset.langBtn));
  });
</script>
</body>
</html>
